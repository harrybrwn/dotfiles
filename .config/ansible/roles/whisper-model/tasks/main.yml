---
- name: Ensure ~/.local/share/whisper exists
  ansible.builtin.file:
    path: '{{ ansible_facts.user_dir }}/.local/share/whisper'
    state: directory
    mode: '0755'

# Normalize the requested model into a GGML filename, so users can pass
# either a short name ("medium.en") or a full filename ("ggml-medium.en.bin").
- name: Derive model filename
  ansible.builtin.set_fact:
    whisper_model_filename: >-
      {%- set name = whisper_model if whisper_model.startswith('ggml-') else 'ggml-' ~ whisper_model -%}
      {{ name if name.endswith('.bin') else name ~ '.bin' }}

- name: Check if the model already exists
  ansible.builtin.stat:
    path: '{{ ansible_facts.user_dir }}/.local/share/whisper/{{ whisper_model_filename }}'
  register: whisper_model_file

- name: Download {{ whisper_model_filename }}
  when: not whisper_model_file.stat.exists
  ansible.builtin.get_url:
    url: 'https://huggingface.co/ggerganov/whisper.cpp/resolve/main/{{ whisper_model_filename }}'
    dest: '{{ ansible_facts.user_dir }}/.local/share/whisper/{{ whisper_model_filename }}'
    mode: '0644'
